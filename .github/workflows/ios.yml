name: iPhone app for testing (sideload)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Sideloadly IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Xcode project tools
        run: gem list -i xcodeproj || sudo gem install xcodeproj
      - name: Create iOS runner
        run: bash tool/bootstrap_platforms.sh ios
      - name: Install dependencies
        run: flutter pub get
      - name: Build without signing credentials
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app/PlugIns/CaptureNestBroadcast.appex
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Capturenest-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: capturenest-ios-unsigned-ipa
          path: build/ios/ipa/Capturenest-unsigned.ipa
          if-no-files-found: error


